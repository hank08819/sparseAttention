[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "msca-sparsity"
version = "1.0.0"
description = "Multi-Scale Cross-Asset Sparse Bidirectional GRU (MSCA-SBiGRU) for cryptocurrency price discovery"
readme = "README.md"
license = { text = "MIT" }
keywords = ["cryptocurrency", "price-discovery", "sparsemax", "attention", "BiGRU", "finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "black", "ruff"]
figures = ["matplotlib>=3.7", "seaborn>=0.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["msca_sparsity*"]
